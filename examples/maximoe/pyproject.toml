[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maximoe"
version = "0.1.0"
description = "A standalone DeepSeek V3 MoE training example for JaxPP."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "absl-py>=2.1",
    "einops>=0.8",
    "jax[cuda13]==0.11.1",
    "jaxpp==0.11.1",
    "jaxtyping>=0.3",
    "nvidia-nccl-cu13==2.31.2",
    "numpy>=2.0",
]

[project.scripts]
maximoe-profile = "maximoe.profile:main"
maximoe-train = "maximoe.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "A", "PLC", "PLE", "PLW", "I"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/maximoe/model.py" = ["F722", "F821"]
"src/maximoe/kernels/moe_routing/*.py" = ["F722", "F821"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = true
